<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>book your journey</title>
    <link rel="stylesheet" href="book.css">
</head>
<body>
    <div class="booking-container">
        <h1>BOOK YOUR JOURNEY</h1>
        <p>Fill in the details below to plan your trip</p>
        <form>
            <label>Full Name:</label>
            <input type="text" placeholder="enter your name"required><br><br>
            <label>Email:</label>
            <input type="email" placeholder="enter your email"required><br><br>
            <label>Phone Number:</label>
            <input type="tel" placeholder="enter your phone number"required><br><br>
            <label>Destination:</label>
            <input type="text" placeholder="enter your destination"required><br><br>
            <label>Travel Date:</label>
            <input type="date"required><br><br>
            <label>Number of Travelers:</label>
            <input type="number"min="1"placeholder="number of people"required><br><br>
            <label>Message:</label>
            <textarea placeholder="any special requirements?"></textarea><br><br>
            <button>CONFIRM BOOKING</button>
        </form>
    </div>
    
</body>
</html>
